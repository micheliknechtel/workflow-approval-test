name: approval-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: echo "actor=${{ github.actor }} sender.type=${{ github.event.sender.type }}"
  # Simulated "bot": real app actor
  gated-for-bot:
    if: github.actor == 'approval-test-mk-b0236a[bot]'
    environment: bot-approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "approved bot run"
  normal:
    if: github.actor != 'approval-test-mk-b0236a[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo "normal run"
  empty-env-test:
    environment: ${{ github.actor == 'nobody[bot]' && 'bot-approval' || '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "empty environment string works"
